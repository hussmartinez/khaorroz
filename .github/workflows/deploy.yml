name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: per-page datePublished/dateModified and IndexNow diffs

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate content
        run: bun scripts/check.ts

      - name: Build (Astro + Pagefind)
        working-directory: apps/web
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: bun run build

      - name: Deploy Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 deploy

      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: bun scripts/indexnow.ts "${{ github.event.before }}"
